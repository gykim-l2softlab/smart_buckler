# Local development configuration. Run with: make run
listen: ":8080"
upstream: "http://127.0.0.1:3000"

waf:
  # detect: log only (default). block: deny requests over the CRS anomaly threshold.
  mode: detect
  # Request body bytes inspected by the WAF. The rest is forwarded without inspection.
  request_body_limit: 1048576

store:
  path: "smart_buckler.db"

log:
  level: debug

# Proxies in front of smart_buckler whose X-Forwarded-For is trusted (CIDR or IP).
# Required when running behind another proxy or tunnel, otherwise a trap hit
# would block the proxy address and every client behind it.
trusted_proxies: []

deception:
  enabled: true
  # How long a client that requested a decoy path stays blocked.
  block_duration: 1h
  # Real upstream path prefixes. Decoys never overlap them.
  reserved_paths: []

score:
  # challenge: serve a proof-of-work challenge to page navigations over the threshold.
  # detect: record would_challenge events only.
  mode: challenge
  threshold: 10
  # Listed weights override the defaults; 0 disables a signal.
  weights:
    html_only: 3
    high_404: 6
    path_enumeration: 6
    fast_requests: 6
    regular_interval: 4
    robots_disallowed: 10
    error_retry: 5
    waf_anomaly: 10

challenge:
  # Leading zero bits of SHA-256. 16 takes well under a second in a browser.
  difficulty: 16
  # How long a solved challenge exempts the client.
  pass_duration: 24h

report:
  # Daily summary of the previous day, sent at this time.
  time: "09:00"
  # IANA time zone for the schedule and day boundaries. Empty: host local time.
  timezone: "Asia/Seoul"
  # Optional: an LLM adds a short summary. Only counts and fixed labels are
  # sent to it, never paths, IPs or User-Agents.
  llm:
    enabled: false
    # openai: any OpenAI-compatible API (Ollama, LM Studio, vLLM, hosted).
    # anthropic: Claude Messages API.
    provider: openai
    # Empty: http://127.0.0.1:11434/v1 for openai, https://api.anthropic.com/v1 for anthropic.
    url: ""
    model: ""
    api_key: ""          # hosted APIs; https is required for remote URLs
    # Reasoning models can think for minutes on a CPU. openai: none, minimal,
    # low, medium, high. anthropic: low, medium, high, xhigh, max.
    # Empty: the model default.
    reasoning_effort: ""
    timeout: 2m

# Delivery channels. All off by default. Keep this file readable only by
# the smart_buckler user (chmod 600) when it holds passwords or tokens.
notify:
  email:
    enabled: false
    host: "smtp.example.com"
    port: 587            # 465 uses implicit TLS; others use STARTTLS when offered
    username: ""
    password: ""
    from: "smart_buckler <security@example.com>"
    to: ["ops@example.com"]
  slack:
    enabled: false
    webhook_url: ""      # https://hooks.slack.com/services/...
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

# Admin web UI. It stays closed until a password is set with
#   smart_buckler admin-password -config FILE
# Keep it on loopback and reach it through an SSH tunnel, or put a TLS
# proxy in front and list its host name under hosts.
admin:
  enabled: true
  listen: "127.0.0.1:8081"
  hosts: []              # extra Host names accepted, e.g. ["admin.example.com"]
  session_duration: 12h
