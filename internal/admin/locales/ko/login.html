{{define "title"}}로그인{{end}}
{{define "content"}}{{with .Data}}
<section class="card login stack">
  <h1>smart_buckler 관리</h1>
  {{if .PasswordSet}}
  {{with .Error}}<p class="flash err" role="alert">{{.}}</p>{{end}}
  <form method="post" action="/login" class="stack">
    <label>비밀번호<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    <button class="btn" type="submit">로그인</button>
  </form>
  {{else}}
  <p>관리자 비밀번호가 아직 없어서 관리 화면이 닫혀 있습니다.</p>
  <p>서버에서 아래 명령으로 비밀번호를 정한 뒤 이 페이지를 새로 고치세요.</p>
  <pre>smart_buckler admin-password -config 설정파일</pre>
  {{end}}
</section>
{{end}}{{end}}
