name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write     # create the release
  id-token: write     # sign the build provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: build
        # Output goes outside the checkout: untracked files would mark the
        # build dirty and stamp "+dirty" into the version.
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir "$dist"
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}; ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w" -o "$dist/smart_buckler_${os}_${arch}${ext}" ./cmd/smart_buckler
          done
          (cd "$dist" && sha256sum smart_buckler_* > SHA256SUMS && cat SHA256SUMS)
      - name: check the stamped version
        run: test "$("$RUNNER_TEMP/dist/smart_buckler_linux_amd64" version)" = "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ runner.temp }}/dist/smart_buckler_*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
